# ====== サイト基本設定(ここを書き換えてください) ======
title: "谷本研究室"
title_en: "Tanimoto Laboratory"
description: "大阪学院大学 谷本研究室 — 大規模数値計算とX線天文衛星で探る超巨大質量ブラックホール"
description_en: "Tanimoto Laboratory, Osaka Gakuin University — Supermassive black holes studied with large-scale simulations and X-ray astronomy satellites"
# ユーザーサイト(username.github.io)の場合は baseurl は空のまま
url: "https://atsushitanimoto.github.io"
baseurl: ""
lang: ja
email: "atsushi.tanimoto@ogu.ac.jp"

# ====== ビルド設定 ======
theme: null
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  news:
    output: true
    permalink: /news/:year/:month/:day/:title/

defaults:
  - scope: { path: "" }
    values: { layout: "default", lang: "ja" }
  - scope: { path: "en" }
    values: { layout: "default", lang: "en" }
  - scope: { path: "", type: "news" }
    values: { layout: "post", lang: "ja" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
